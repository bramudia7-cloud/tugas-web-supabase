<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login - Supabase & AI Workflow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); width: 380px; text-align: center; border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; }
    input, textarea { width: 100%; padding: 11px; margin: 8px 0; box-sizing: border-box; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; }
    button { width: 100%; padding: 11px; margin-top: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-login { background: #3b82f6; color: white; }
    .btn-register { background: #10b981; color: white; }
    .btn-google { background: #ea4335; color: white; margin-top: 14px; }
    .btn-logout { background: #64748b; color: white; margin-top: 16px; }
    #dashboard-panel { display: none; }
    .ai-box { background: #0f172a; padding: 14px; border-radius: 8px; margin-top: 16px; text-align: left; border: 1px solid #334155; font-size: 13px; }
    .badge { display: inline-block; background: #334155; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin: 2px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="card">
    <!-- FORM LOGIN & REGISTER -->
    <div id="auth-panel">
      <h2>Login & Register</h2>
      <div style="margin-bottom: 12px;">
        <span class="badge">Supabase</span>
        <span class="badge">Vercel</span>
        <span class="badge">9Router + Hermes</span>
      </div>
      <input type="email" id="email" placeholder="Masukkan Email" required>
      <input type="password" id="password" placeholder="Masukkan Password (min. 6 karakter)" required>
      <button class="btn-login" id="btnLogin">Login</button>
      <button class="btn-register" id="btnRegister">Register Akun Baru</button>
      <hr style="border-color: #334155; margin: 18px 0;">
      <button class="btn-google" id="btnGoogle">Sign in with Google</button>
    </div>

    <!-- DASHBOARD SETELAH BERHASIL LOGIN -->
    <div id="dashboard-panel">
      <h2>Berhasil Login! 🎉</h2>
      <p style="margin: 4px 0; color: #94a3b8;">Login sebagai:</p>
      <p id="userEmail" style="color: #38bdf8; font-weight: bold; margin-top: 0;"></p>

      <!-- Panel Tes Koneksi Ngrok -> 9Router -> Gemini -->
      <div class="ai-box">
        <strong>🤖 Integrasi 9Router / Hermes Agent (via Ngrok):</strong>
        <input type="text" id="ngrokUrl" placeholder="Paste URL Ngrok (https://xxxx.ngrok-free.app)">
        <textarea id="promptInput" rows="2" placeholder="Ketik pesan untuk dites ke Gemini API..."></textarea>
        <button class="btn-login" id="btnSendAI">Kirim ke AI Router</button>
        <div id="aiResponse" style="margin-top: 10px; color: #a7f3d0; white-space: pre-wrap;"></div>
      </div>

      <button class="btn-logout" id="btnLogout">Logout</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // WAJIB DIGANTI DENGAN PROJECT URL & ANON KEY DARI SUPABASE KAMU!
    // =========================================================================
    const SUPABASE_URL = "https://pqsmxbbzqpowubkepyko.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0TfTHOV4JFiAexEjw4Oj4g_3HAoUwoQ";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // 1. Fungsi Register
    document.getElementById('btnRegister').addEventListener('click', async () => {
      const { data, error } = await supabaseClient.auth.signUp({
        email: emailInput.value.trim(),
        password: passwordInput.value.trim()
      });
      if (error) {
        alert("Gagal Register: " + error.message);
      } else {
        alert("Registrasi berhasil! Otomatis masuk ke dashboard.");
      }
    });

    // 2. Fungsi Login
    document.getElementById('btnLogin').addEventListener('click', async () => {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value.trim()
      });
      if (error) {
        alert("Gagal Login: " + error.message);
      }
    });

    // 3. Fungsi Google Sign-In
    document.getElementById('btnGoogle').addEventListener('click', async () => {
      const { data, error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      });
      if (error) {
        alert("Gagal Google Sign-In: " + error.message);
      }
    });

    // 4. Fungsi Logout
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
    });

    // 5. Deteksi Otomatis Apakah User Sedang Login atau Tidak
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session && session.user) {
        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('dashboard-panel').style.display = 'block';
        document.getElementById('userEmail').innerText = session.user.email;
      } else {
        document.getElementById('auth-panel').style.display = 'block';
        document.getElementById('dashboard-panel').style.display = 'none';
      }
    });

    // 6. Fungsi Mengirim Pesan ke 9Router / Hermes Agent lewat Ngrok
    document.getElementById('btnSendAI').addEventListener('click', async () => {
      const ngrokUrl = document.getElementById('ngrokUrl').value.trim().replace(/\/$/, "");
      const prompt = document.getElementById('promptInput').value.trim();
      const out = document.getElementById('aiResponse');

      if (!ngrokUrl) return alert("Tempelkan URL Ngrok kamu dulu!");
      out.innerText = "Sedang menghubungi 9Router / Hermes via Ngrok...";

      try {
        const response = await fetch(`${ngrokUrl}/v1/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({
            model: "gemini-2.5-flash",
            messages: [{ role: "user", content: prompt || "Halo! Tes koneksi." }]
          })
        });
        const result = await response.json();
        out.innerText = result.choices?.[0]?.message?.content || JSON.stringify(result, null, 2);
      } catch (err) {
        out.innerText = "Error koneksi Ngrok: " + err.message;
      }
    });
  </script>
</body>
</html>
